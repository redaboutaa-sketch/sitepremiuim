# ==========================================================================
# IVAN ARSENOV — pile derrière le Traefik existant
#
# Les ports 80 et 443 du VPS appartiennent à Traefik, qui sert déjà une
# dizaine d'applications. Ce site ne les réclame donc pas : il écoute en
# clair sur un port interne et Traefik termine TLS devant lui.
#
# Rien ici ne touche à Traefik ni aux autres piles. Les trois valeurs qui
# dépendent de SON installation — réseau, point d'entrée, résolveur de
# certificats — sont dans `.env`, pas écrites en dur : elles se relèvent sur
# une pile existante, elles ne se devinent pas.
#
#     docker compose up -d
# ==========================================================================

services:
  # ── Le serveur du site ────────────────────────────────────────────────
  ivan-arsenov-web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      # Le site, déployé par `ivan-deploy` sur l'hôte. En lecture seule : ce
      # conteneur n'a aucune raison d'écrire dans ce qu'il sert.
      - /var/www/ivan-arsenov.de/public_html:/var/www/ivan-arsenov.de/public_html:ro
      # ⚠️ Fichiers GÉNÉRÉS (scripts/build-nginx.mjs). Ne pas les éditer ici.
      - ./nginx/ivan-arsenov.de.proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
    networks:
      - traefik
      - interne
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK}

      # Les QUATRE noms arrivent ici. Les trois non canoniques ne sont pas
      # redirigés par Traefik mais par la configuration nginx, qui tient
      # cette règle depuis `site.config.mjs` — une seule source de vérité.
      - >-
        traefik.http.routers.ivanarsenov.rule=Host(`www.ivan-arsenov.de`)
        || Host(`ivan-arsenov.de`)
        || Host(`www.ivanarsenov.de`)
        || Host(`ivanarsenov.de`)
      - traefik.http.routers.ivanarsenov.entrypoints=${TRAEFIK_ENTRYPOINT_HTTPS}
      - traefik.http.routers.ivanarsenov.tls=true
      - traefik.http.routers.ivanarsenov.tls.certresolver=${TRAEFIK_CERTRESOLVER}
      - traefik.http.services.ivanarsenov.loadbalancer.server.port=8080

      # Entrée en clair → https, en une seule redirection. Si ce Traefik
      # porte déjà une redirection globale sur ce point d'entrée, elle
      # s'applique avant ce routeur, qui ne sert alors jamais : inoffensif.
      # S'il n'en porte pas, sans ces lignes http ne serait pas routé DU
      # TOUT — pas redirigé : non servi.
      - >-
        traefik.http.routers.ivanarsenov-http.rule=Host(`www.ivan-arsenov.de`)
        || Host(`ivan-arsenov.de`)
        || Host(`www.ivanarsenov.de`)
        || Host(`ivanarsenov.de`)
      - traefik.http.routers.ivanarsenov-http.entrypoints=${TRAEFIK_ENTRYPOINT_HTTP}
      - traefik.http.routers.ivanarsenov-http.middlewares=ivanarsenov-tohttps
      # Priorité minimale, par précaution. À défaut de priorité explicite,
      # Traefik classe les routeurs par LONGUEUR DE RÈGLE — et la nôtre, qui
      # énumère quatre hôtes, est inhabituellement longue. Le routeur interne
      # qui répond au défi ACME ne doit jamais passer après : il servirait
      # une redirection vers https à Let's Encrypt, qui interroge en clair,
      # et le certificat ne serait jamais émis.
      - traefik.http.routers.ivanarsenov-http.priority=1
      - traefik.http.middlewares.ivanarsenov-tohttps.redirectscheme.scheme=https
      - traefik.http.middlewares.ivanarsenov-tohttps.redirectscheme.permanent=true

  # ── L'endpoint du formulaire ──────────────────────────────────────────
  # Le nom de ce service EST le nom d'hôte que nginx appelle en FastCGI
  # (`fastcgi_pass ivan-arsenov-php:9000`). Le renommer casse le formulaire,
  # et rien d'autre : le site continuerait de s'afficher.
  ivan-arsenov-php:
    build:
      context: .
      dockerfile: Dockerfile.php
    restart: unless-stopped
    volumes:
      - /var/www/ivan-arsenov.de/public_html:/var/www/ivan-arsenov.de/public_html:ro
      # Le RÉPERTOIRE, pas les fichiers un par un : monter un fichier dont la
      # source n'existe pas encore fait créer par Docker un répertoire vide à
      # sa place, et le conteneur démarre avec une configuration qui n'en est
      # pas une. L'entrypoint recopie ensuite ces fichiers avec le
      # propriétaire et les droits attendus dans le conteneur.
      - /etc/ivan-arsenov:/host-config:ro
    networks:
      - interne
    # Pas exposé à Traefik : ce conteneur ne doit être joignable que par
    # nginx. Aucun label, aucun port publié.

networks:
  # Le réseau de Traefik, créé par SA pile. `external: true` dit bien :
  # « il existe déjà, ne le crée pas ».
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK}
  interne:
    driver: bridge
